[package]
name = "gerrit-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Exposes `fake::FakeHttpClient` for tests in downstream crates.
test-support = []

[dependencies]
base64.workspace = true
futures.workspace = true
http.workspace = true
model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Blocking HTTP for the opt-in tests against a local dev Gerrit
# (tests/dev_gerrit.rs). No TLS, no default features: the dev Gerrit is
# plain http on 127.0.0.1. Speaks the `http` crate types we already use.
ureq = { version = "3", default-features = false }

[lints]
workspace = true
