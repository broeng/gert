[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Runs the slow tests (full-page and whole-shell flows, temporary git
# repositories), which are ignored otherwise. Per-commit runs skip them; a
# batch of work ends with `cargo test --workspace --features ui/slow-tests`.
slow-tests = []

[dependencies]
futures.workspace = true
gerrit-api.workspace = true
globset.workspace = true
gpui-kit.workspace = true
jiff.workspace = true
local-git.workspace = true
log.workspace = true
model.workspace = true
serde_json.workspace = true
store.workspace = true
sync.workspace = true
syntect.workspace = true
thiserror.workspace = true
two-face.workspace = true

[dev-dependencies]
gerrit-api = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
http.workspace = true
local-git = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
